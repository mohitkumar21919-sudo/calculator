<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <h1 class="text-center">welcome to calculator</h1>
    <h2 class="text-center">Simple Calculator</h2>
    <div class="container flex flex-col  items-center mx-auto ">
        <div class="row">
            <input class="input" type="text" />
        </div>
        <div class="row">
            <button class="button">C</button>
            <button class="button">%</button>
            <button class="button">^</button>
            <button class="button">/</button>
        </div>
        <div class="row">
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button">X</button>
        </div>
        <div class="row">
            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button">-</button>
        </div>
        <div class="row">
            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button">+</button>
        </div>
        <div class="row">
            <button class="button">0 </button>
            <button class="button">.</button>
            <button class="button">=</button>
            <button class="button">()</button>
        </div>

    </div>
    <script src="script.js"></script>

    
    <footer>
        <p>&copy; 2023 Simple Calculator. All rights reserved. | <a href="https://www.instagram.com/learnwithlucid?igsh=MTkwM3RobTRqZmxoYg%3D%3D" target="_blank">built by learn with lucidcode</a>
        </p>
    </footer>

</body>

</html>
